name: Validate EGX game

on:
  push:
    branches: ["main"]
    paths:
      - "js/**"
      - "index.html"
      - "style.css"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript syntax
        run: |
          node --check js/game.js
          node --check scripts/prepare-site.mjs

      - name: Assemble the GitHub Pages site
        run: npm run build

      - name: Verify required site files
        run: |
          test -s _site/index.html
          test -s _site/js/game.js
          test -s _site/style.css
